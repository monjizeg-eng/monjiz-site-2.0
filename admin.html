<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المشرف | منجز Monjiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; }
    .admin-table-card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:var(--shadow); margin-bottom:28px; }
    .admin-table-card h2 { font-size:22px; font-weight:900; margin-bottom:16px; }
    table.admin { width:100%; border-collapse:collapse; font-size:14px; }
    table.admin th, table.admin td { border-bottom:1px solid var(--line); padding:10px 8px; text-align:right; vertical-align:top; }
    table.admin th { background:var(--beige); font-weight:800; }
    .admin input, .admin select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px; }
    .admin .mini { width:auto; }
    .admin .actions a, .admin .actions button { margin-inline-end:6px; font-size:13px; }
    .btn-danger { background:#fff; color:#b00020; border:1px solid #e6c9cb; }
    .btn-sm { padding:6px 12px; }
    .thumbs img { width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line); margin:2px; }
    .admin-note { font-size:14px; color:var(--muted); margin-bottom:18px; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">م</span>
        <span class="brand-text" data-i18n="brand">منجز <em>Monjiz</em></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">الرئيسية</a>
        <a href="dashboard.html">حسابي</a>
        <div class="lang-switch" aria-label="Language"></div>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="القائمة"><span></span><span></span><span></span></button>
    </div>
  </header>

  <section class="section">
    <div class="admin-wrap">
      <div class="dash-top" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px">
        <h1 style="font-size:30px;font-weight:900">لوحة المشرف</h1>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">تسجيل الخروج</button>
      </div>
      <p class="admin-note" id="adminMsg"></p>

      <div class="admin-table-card">
        <h2>المستقلون</h2>
        <div id="freelancerTable"></div>
      </div>

      <div class="admin-table-card">
        <h2>العملاء</h2>
        <div id="clientTable"></div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
