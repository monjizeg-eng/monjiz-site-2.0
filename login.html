<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | منجز Monjiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">م</span>
        <span class="brand-text" data-i18n="brand">منجز <em>Monjiz</em></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="nav.home">الرئيسية</a>
        <a href="freelancers.html" data-i18n="nav.freelancers">المستقلون</a>
        <div class="lang-switch" aria-label="Language"></div>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="القائمة"><span></span><span></span><span></span></button>
    </div>
  </header>

  <section class="auth-page">
    <form class="auth-card" id="loginForm" novalidate>
      <a href="index.html" class="brand">
        <span class="brand-mark">م</span>
        <span class="brand-text" data-i18n="brand">منجز <em>Monjiz</em></span>
      </a>
      <div class="auth-head">
        <h1 data-i18n="auth.loginTitle">تسجيل الدخول</h1>
        <p data-i18n="auth.loginSubtitle">ادخل لحسابك لتعديل ملفك أو إدارة مستقلّيك.</p>
      </div>

      <div class="field">
        <label for="lnEmail" data-i18n="auth.loginEmail">البريد الإلكتروني</label>
        <input class="input" id="lnEmail" type="email" data-i18n-ph="ph.email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="lnPass" data-i18n="auth.loginPassword">كلمة المرور</label>
        <input class="input" id="lnPass" type="password" data-i18n-ph="ph.password" placeholder="••••••••" />
      </div>

      <div id="loginMsg" style="font-size:14px;margin-bottom:12px"></div>

      <button type="submit" class="btn btn-dark btn-block" data-i18n="auth.loginSubmit">دخول</button>

      <p class="auth-alt"><span data-i18n="auth.loginNoAccount">مش عندك حساب؟</span> <a href="signup/freelancer.html" data-i18n="auth.loginSignUpFreelancer">انضم كمستقل</a> · <a href="signup/client.html" data-i18n="auth.loginSignUpClient">سجّل كعميل</a></p>
      <p class="form-note" data-i18n="auth.loginAdminNote">للمشرف: بعد الدخول ستنتقل تلقائيًا للوحة التحكم.</p>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const msg = document.getElementById("loginMsg");

    // If already logged in (incl. after Google redirect), ensure profile + go to dashboard
    (async () => {
      const role = new URLSearchParams(location.search).get("role");
      setTimeout(async () => {
        const uid = await getUserId();
        if (!uid) return;
        if (role) {
          const hasProfile = (await getFreelancerByAuth(uid)) || (await getClientByAuth(uid));
          if (!hasProfile) {
            if (role === "freelancer") {
              await saveFreelancer({ auth_id: uid, name: "", email: "", niche: "design", approved: true });
            } else if (role === "client") {
              await saveClient({ auth_id: uid, name: "", company: "", interest: "design" });
            }
          }
        }
        location.href = "dashboard.html";
      }, 1500);
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("lnEmail").value.trim();
      const password = document.getElementById("lnPass").value;
      msg.textContent = "";
      const { error, data } = await signIn(email, password);
      if (error) {
        msg.style.color = "#b00020";
        msg.textContent = error.message || I18N.t("auth.loginError");
      } else {
        msg.style.color = "#1a7f37";
        msg.textContent = I18N.t("auth.loginSuccess");
        setTimeout(() => (location.href = "dashboard.html"), 400);
      }
    });
  </script>
</body>
</html>
