<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل العميل | منجز Monjiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">
        <span class="brand-mark">م</span>
        <span class="brand-text" data-i18n="brand">منجز <em>Monjiz</em></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="../index.html" data-i18n="nav.home">الرئيسية</a>
        <a href="../freelancers.html" data-i18n="nav.freelancers">المستقلون</a>
        <div class="lang-switch" aria-label="Language"></div>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="القائمة"><span></span><span></span><span></span></button>
    </div>
  </header>

  <section class="auth-page">
    <form class="auth-card" id="clientForm" novalidate>
      <a href="../index.html" class="brand">
        <span class="brand-mark">م</span>
        <span class="brand-text" data-i18n="brand">منجز <em>Monjiz</em></span>
      </a>
      <div class="auth-head">
        <h1 data-i18n="auth.clientTitle">سجّل كعميل</h1>
        <p data-i18n="auth.clientSub">انشر مهامك وتواصل مع محترفين مصريين موثقين ينجزونها بسرعة.</p>
      </div>

      <div class="field">
        <label for="cName" data-i18n="auth.name">الاسم الكامل</label>
        <input class="input" id="cName" name="name" type="text" required data-i18n-ph="ph.name" />
      </div>

      <div class="row2">
        <div class="field">
          <label for="cCompany"><span data-i18n="auth.company">اسم الشركة / النشاط</span> <small data-i18n="auth.optional">(اختياري)</small></label>
          <input class="input" id="cCompany" name="company" type="text" data-i18n-ph="ph.company" />
        </div>
        <div class="field">
          <label for="cPhone"><span data-i18n="auth.phone">رقم الهاتف (واتساب)</span></label>
          <input class="input" id="cPhone" name="phone" type="tel" required data-i18n-ph="ph.phone" />
        </div>
      </div>

      <div class="field">
        <label for="cEmail" data-i18n="auth.email">البريد الإلكتروني</label>
        <input class="input" id="cEmail" name="email" type="email" required data-i18n-ph="ph.email" />
      </div>

      <div class="field">
        <label for="cPass"><span data-i18n="auth.password">كلمة المرور</span></label>
        <input class="input" id="cPass" name="password" type="password" required minlength="8" data-i18n-ph="ph.password" />
        <small data-i18n="auth.passHint">٨ أحرف على الأقل</small>
      </div>

      <div class="field">
        <label data-i18n="auth.interest">ما نوع المهام التي تفكر في نشرها؟</label>
        <select class="input" name="interest">
          <option value="design" data-i18n="services.designT">التصميم والمحتوى البصري</option>
          <option value="web" data-i18n="services.webT">تطوير المواقع</option>
          <option value="marketing" data-i18n="services.mktT">التسويق الرقمي</option>
          <option value="business" data-i18n="services.bizT">دعم الأعمال</option>
          <option value="other" data-i18n="interest.other">أخرى / لست متأكداً</option>
        </select>
      </div>

      <label class="check">
        <input type="checkbox" required />
        <span data-i18n="auth.terms">أوافق على شروط الاستخدام وسياسة الخصوصية في منجز.</span>
      </label>

      <button type="submit" class="btn btn-dark btn-block" data-i18n="auth.submitClient">إنشاء حساب العميل</button>

      <p class="auth-alt"><a href="../signup/freelancer.html" data-i18n="auth.switchToF">انضم كمستقل بدلاً من ذلك</a></p>
      <p class="form-note" data-i18n="auth.noteClient">بتسجيلك، أنت توافق على استلام إشعارات عبر واتساب وبريدك الإلكتروني.</p>
    </form>
  </section>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
